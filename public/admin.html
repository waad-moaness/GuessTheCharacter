<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Photo manager</title>
<style>
:root{--ink:#16120e;--bg:#f2e6c9;--paper:#fffaf0;--hot:#e8321e;--good:#3ccf91}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:16px}
h1{margin:0 0 4px}.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,input[type=text]{font:inherit;border:2px solid var(--ink);border-radius:8px;padding:6px 10px;background:var(--paper)}button{cursor:pointer;background:var(--hot);color:#fff;font-weight:700}
button.alt{background:var(--paper);color:var(--ink)}h2{margin:22px 0 8px;font-size:17px}.grid{display:flex;flex-wrap:wrap;gap:10px}
.card{width:190px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:8px}.card.ok{border-color:var(--good)}
.ph{height:150px;border-radius:6px;background:#ddd center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#777}
.card input[type=text]{width:100%;margin-top:6px;font-size:13px}.row{display:flex;gap:6px;margin-top:6px}.row button{flex:1;padding:5px;font-size:13px}
#msg{font-weight:700}
</style></head><body>
<h1>Photo manager</h1>
<div class="bar"><span id="stats">Loading…</span><label><input type="checkbox" id="only"> show missing only</label><span id="msg"></span></div>
<div id="out"></div>
<script>
const key = new URLSearchParams(location.hash.slice(1)).get('key') || '';
const out = document.getElementById('out'), msg = t => { document.getElementById('msg').textContent = t; };
const q = (path, opt) => fetch(path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key), opt).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Error'); return j; });
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null;
async function load() {
  try { data = await q('/api/admin/list'); } catch (e) { out.innerHTML = '<p>' + esc(e.message) + '. Open the link printed in the server log (it ends with #key=...).</p>'; return; }
  document.getElementById('stats').textContent = `${data.haveNames} of ${data.totalNames} names have a photo, ${data.playable} categories playable`;
  draw();
}
function draw() {
  const only = document.getElementById('only').checked;
  out.innerHTML = data.categories.map(c => {
    const items = c.items.filter(i => !only || !i.image);
    if (!items.length) return '';
    return `<h2>${esc(c.clue)}</h2><div class="grid">${items.map(i => `
      <div class="card ${i.image ? 'ok' : ''}" data-slug="${esc(i.slug)}">
        <div class="ph" style="${i.image ? `background-image:url('${esc(i.image)}')` : ''}">${i.image ? '' : 'no photo'}</div>
        <b>${esc(i.name)}</b>
        <input type="text" placeholder="paste image link">
        <div class="row"><button data-act="link">Use link</button><button class="alt" data-act="file">Upload</button>${i.image ? '<button class="alt" data-act="del">Remove</button>' : ''}</div>
      </div>`).join('')}</div>`;
  }).join('');
}
out.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const card = b.closest('.card'), slug = card.dataset.slug;
  try {
    if (b.dataset.act === 'link') {
      const url = card.querySelector('input').value.trim(); if (!url) return;
      msg('Downloading…'); await q('/api/admin/fetch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug, url }) });
    } else if (b.dataset.act === 'file') {
      const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/jpeg,image/png,image/webp';
      f.onchange = async () => { msg('Uploading…'); try { await q('/api/admin/upload?slug=' + encodeURIComponent(slug), { method: 'POST', body: f.files[0] }); msg('Saved'); await load(); } catch (x) { msg(x.message); } };
      f.click(); return;
    } else if (b.dataset.act === 'del') {
      if (!confirm('Remove this photo?')) return;
      await q('/api/admin/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slug }) });
    }
    msg('Saved'); await load();
  } catch (x) { msg(x.message); }
});
document.getElementById('only').onchange = draw;
load();
</script></body></html>
